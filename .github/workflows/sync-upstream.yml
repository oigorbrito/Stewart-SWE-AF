name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Agent-Field/SWE-AF.git
          git fetch upstream main

      - name: Merge upstream directly into main
        run: |
          if git diff --quiet HEAD upstream/main; then
            echo "Fork is already up to date with upstream."
            exit 0
          fi

          git merge --no-edit upstream/main
          git push origin main
