# Upstream issue synchronization is intentionally suspended.
# GitHub Issues are disabled in this repository (GitHub API returned HTTP 410).
# Keep the workflow file as a documented placeholder; do not schedule or
# grant issue-write permissions until maintainers explicitly approve mirroring.
name: Sync upstream issues (suspended)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suspended:
    runs-on: ubuntu-latest
    steps:
      - name: Explain suspended synchronization
        run: |
          echo "Upstream issue sync is suspended: GitHub Issues are disabled in this repository."
          echo "No upstream API calls or issue mutations are performed."
